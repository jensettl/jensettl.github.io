# Site
name: "Jens' Blog"
title: "Jens' Blog"
description: "Welcome to my little footprint on the web."
subheader: "This is where I share my projects and thoughts on coding, automation and technology, documenting what I learn along the way."
logo: 'assets/images/logo_black_cropped.png'
favicon: 'assets/images/logo_black_cropped.png'
url: "https://jensettl.com"
baseurl: ""
# Optional integrations: leave empty to disable
google_analytics: ''  # GA4 measurement ID, e.g. 'G-XXXXXXXXXX'
disqus: ''            # your own Disqus shortname enables comments on posts
include: ["_pages"]
permalink: /:title/
email: ettljens@gmail.com

# Authors
authors:
  jens:
    name: Jens
    display_name: Jens
    avatar: 'assets/images/avatar-jens.png'
    email: ettljens@gmail.com
    description: "I love to tackle problems with creative coding solutions and automations."

# Post defaults: every post gets these unless its front matter says otherwise.
# The folder a post lives in (_posts/projects|articles|reviews) sets its type and URL,
# e.g. _posts/projects/2025-10-22-heic-converter/ -> /projects/heic-converter/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: jens
  - scope:
      path: "_posts/projects"
    values:
      type: project
      permalink: /projects/:title/
  - scope:
      path: "_posts/articles"
    values:
      type: article
      permalink: /articles/:title/
  - scope:
      path: "_posts/reviews"
    values:
      type: review
      permalink: /reviews/:title/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-figure
  - jekyll-postfiles
  - jekyll-redirect-from
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 6
paginate_path: /page:num/
    
# Sass
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true                 # no deprecation warnings from vendored Bootstrap (_sass/bootstrap)
  silence_deprecations: [ import ] # Bootstrap 4 needs @import; @use would need a Bootstrap 5 migration

# Markdown Processing
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'language-'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

exclude: [LICENSE.txt, README.md, Gemfile, Gemfile.lock, CLAUDE.md, PRODUCT.md, DESIGN.md, vendor/, .bundle/, .jekyll-cache/]

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: ""
adsense-data-ad-slot: ""

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

# Post Author Box ("enabled" or "disabled")
authorbox: "disabled"
