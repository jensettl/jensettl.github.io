{% comment %}
Site search: a dialog opened by the Search button in the header, "/" or Ctrl+K (assets/js/search.js).
lunr and the search index (assets/js/lunrsearchengine.js) load the first time it opens.
{% endcomment %}
<dialog id="search" class="search-dialog" aria-label="Search the blog"
        data-lunr="{{ site.baseurl }}/assets/js/lunr.js"
        data-index="{{ site.baseurl }}/assets/js/lunrsearchengine.js">
    <div class="search-panel">
        <form class="search-bar" role="search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="search-input" placeholder="Search projects, articles and reviews"
                   autocomplete="off" spellcheck="false" enterkeyhint="go"
                   aria-label="Search" aria-controls="search-results" aria-describedby="search-status">
            <button type="button" class="search-close" data-search-close aria-label="Close search"><kbd>Esc</kbd></button>
        </form>
        <p id="search-status" class="search-status" role="status" aria-live="polite"></p>
        <ul id="search-results" class="search-results" aria-label="Results"></ul>
        <p class="search-keys" aria-hidden="true"><kbd>&uarr;</kbd><kbd>&darr;</kbd> move <kbd>Enter</kbd> open <kbd>Esc</kbd> close</p>
    </div>
</dialog>
<script src="{{ site.baseurl }}/assets/js/search.js" defer></script>
